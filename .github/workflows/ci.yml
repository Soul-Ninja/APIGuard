name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e .

      - name: Run Pytest Suite
        run: |
          python -m pytest backend/tests -v

  action-test:
    name: Test GitHub Action on Demo Profile
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The action scans a running API (like a user's workflow would), so start the demo target first
      - name: Set up Python 3.12
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.12"

      - name: Start demo API
        run: |
          pip install .
          nohup python -m uvicorn apiguard.main:app --port 8000 > demo_api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && exit 0; sleep 1; done
          cat demo_api.log; exit 1

      - name: Run APIGuard Action
        uses: ./
        with:
          profile: "backend/apiguard/targets/demo.yaml"
          fail-on: "none"
          upload-sarif: "false"
          comment: "false"
          python-version: "3.12"

      - name: Verify SARIF Output
        run: |
          test -f apiguard.sarif
          python -c "import json; data=json.load(open('apiguard.sarif')); results=data['runs'][0]['results']; print(f'SARIF verified with {len(results)} results'); assert len(results) >= 1"
