[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apiguard-cli"
version = "0.3.0"
description = "API authorization scanner: proves BOLA, BFLA, BOPLA, broken auth and misconfigurations (OWASP API Top 10) with two-user testing."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["security", "api", "bola", "idor", "bfla", "bopla", "owasp", "openapi", "dast", "sarif"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]
# Lower bounds from the tested backend/requirements.txt majors; exact pins stay in that file for dev.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "openapi-spec-validator>=0.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/Soul-Ninja/APIGuard"
Demo = "https://soul-ninja.github.io/APIGuard/"

[project.scripts]
apiguard = "apiguard.engine.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["apiguard*"]
namespaces = true

[tool.setuptools.package-data]
apiguard = ["targets/*.yaml"]
